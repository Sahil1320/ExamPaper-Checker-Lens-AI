  <path d="M 42 55 Q 50 53 50 57 Q 50 53 58 55 L 57 59 Q 50 57 50 60 Q 50 57 43 59 Z" fill="#1b5e20"/>

  <!-- DPS Ribbon / Banner at Bottom -->
  <path d="M 22 72 Q 50 78 78 72 L 75 79 Q 50 85 25 79 Z" fill="url(#gold)" stroke="#B78103" stroke-width="0.8"/>
  <text x="50" y="77.5" font-family="sans-serif" font-size="6.5" font-weight="900" fill="#1b5e20" text-anchor="middle" letter-spacing="1">DPS</text>

  <!-- Star at Top -->
  <polygon points="50,14 52,19 57,19 53,22 55,27 50,24 45,27 47,22 43,19 48,19" fill="url(#gold)"/>
