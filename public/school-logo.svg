<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="schoolBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2e7d32"/>
      <stop offset="85%" stop-color="#1b5e20"/>
      <stop offset="100%" stop-color="#0d3810"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
  </defs>

  <!-- Circular Base -->
  <circle cx="50" cy="50" r="48" fill="url(#schoolBg)" stroke="#FFD54F" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Laurel Wreath Left -->
  <path d="M 24 58 C 22 45, 27 33, 37 26 C 36 31, 33 40, 34 49 C 31 52, 27 55, 24 58 Z" fill="url(#gold)" opacity="0.9"/>
  <circle cx="28" cy="38" r="2.5" fill="url(#gold)"/>
  <circle cx="25" cy="47" r="2.5" fill="url(#gold)"/>
  <circle cx="31" cy="30" r="2" fill="url(#gold)"/>

  <!-- Laurel Wreath Right -->
  <path d="M 76 58 C 78 45, 73 33, 63 26 C 64 31, 67 40, 66 49 C 69 52, 73 55, 76 58 Z" fill="url(#gold)" opacity="0.9"/>
  <circle cx="72" cy="38" r="2.5" fill="url(#gold)"/>
  <circle cx="75" cy="47" r="2.5" fill="url(#gold)"/>
  <circle cx="69" cy="30" r="2" fill="url(#gold)"/>

  <!-- Central Shield -->
  <path d="M 38 34 L 62 34 Q 63 52 50 64 Q 37 52 38 34 Z" fill="#ffffff" stroke="#FFD54F" stroke-width="1.5"/>

  <!-- Torch / Flame on Shield -->
  <path d="M 50 37 Q 53 41 50 46 Q 47 41 50 37 Z" fill="#FF5722"/>
